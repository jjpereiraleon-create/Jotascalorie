<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>PulseFit • iOS Edition</title>
    <link rel="manifest" href='data:application/manifest+json,{"name":"PulseFit","short_name":"PulseFit","start_url":".","display":"standalone","background_color":"#000000","theme_color":"#000000","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2964/2964514.png","sizes":"512x512","type":"image/png"}]}'>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        iosDark: '#000000',
                        iosCard: 'rgba(28, 28, 30, 0.75)',
                        iosBorder: 'rgba(255, 255, 255, 0.12)',
                        iosActive: '#0A84FF',
                        iosGreen: '#30D158',
                        iosOrange: '#FF9F0A',
                        iosPink: '#FF375F',
                        iosTeal: '#64D2FF'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .apple-glass {
            background: rgba(28, 28, 30, 0.72);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .apple-button {
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .apple-button:active {
            transform: scale(0.96);
            opacity: 0.85;
        }
        .circle-progress {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-28">

    <!-- Header Estilo iOS -->
    <header class="sticky top-0 z-40 apple-glass px-5 py-3.5 flex justify-between items-center">
        <div>
            <p id="greetingText" class="text-xs font-medium text-neutral-400 uppercase tracking-wider">HOLA</p>
            <h1 id="userNameDisplay" class="text-xl font-bold tracking-tight">Atleta</h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="exportForAI()" class="px-3 py-1.5 rounded-full bg-iosActive/20 text-iosActive border border-iosActive/30 text-xs font-semibold flex items-center gap-1.5 apple-button">
                <i class="fa-solid fa-sparkles"></i> Copiar IA
            </button>
            <button onclick="toggleModal('settingsModal')" class="w-9 h-9 rounded-full bg-neutral-800/80 border border-neutral-700/60 flex items-center justify-center text-neutral-300 apple-button">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </header>

    <!-- Barra de Vistas (Hoy vs Historial) -->
    <div class="max-w-md mx-auto px-4 mt-3">
        <div class="bg-neutral-900/80 p-1 rounded-2xl flex border border-neutral-800">
            <button id="tabToday" onclick="switchView('today')" class="flex-1 py-1.5 text-xs font-semibold rounded-xl bg-neutral-800 text-white shadow-sm transition-all">Hoy</button>
            <button id="tabHistory" onclick="switchView('history')" class="flex-1 py-1.5 text-xs font-semibold rounded-xl text-neutral-400 transition-all">Historial Semanal</button>
        </div>
    </div>

    <!-- VISTA PRINCIPAL (HOY) -->
    <main id="todayView" class="max-w-md mx-auto p-4 space-y-4">

        <!-- Anillo de Calorías y Resumen iOS -->
        <section class="apple-glass rounded-3xl p-5 shadow-2xl relative overflow-hidden">
            <div class="flex justify-between items-center">
                <div>
                    <span class="text-xs uppercase tracking-wider font-semibold text-neutral-400">Calorías Restantes</span>
                    <div class="flex items-baseline gap-1 mt-0.5">
                        <span id="calRemaining" class="text-4xl font-extrabold tracking-tight">2,750</span>
                        <span class="text-xs font-medium text-neutral-500">kcal</span>
                    </div>
                    <div class="flex gap-3 text-xs text-neutral-400 mt-2">
                        <span>Meta: <b id="calTarget" class="text-white">2,750</b></span>
                        <span>Ingesta: <b id="calEaten" class="text-iosGreen">0</b></span>
                    </div>
                </div>

                <!-- Circular Progress Ring Apple Style -->
                <div class="relative w-24 h-24 flex items-center justify-center">
                    <svg class="w-24 h-24" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" stroke="rgba(255,255,255,0.08)" stroke-width="9" fill="none" />
                        <circle id="calSvgRing" class="circle-progress" cx="50" cy="50" r="40" stroke="#30D158" stroke-width="9" stroke-linecap="round" fill="none" stroke-dasharray="251.2" stroke-dashoffset="251.2" />
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span id="calPercent" class="text-sm font-bold">0%</span>
                    </div>
                </div>
            </div>

            <!-- Macros Cards / Widgets -->
            <div class="grid grid-cols-3 gap-2.5 mt-5 pt-4 border-t border-white/5">
                <!-- Proteína -->
                <div class="bg-neutral-900/60 border border-white/5 p-3 rounded-2xl">
                    <span class="text-[11px] font-medium text-iosActive block mb-0.5">Proteína</span>
                    <p id="protText" class="text-sm font-bold text-white">0 / 150g</p>
                    <div class="w-full bg-neutral-800 h-1.5 rounded-full mt-2 overflow-hidden">
                        <div id="protBar" class="bg-iosActive h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
                <!-- Carbos -->
                <div class="bg-neutral-900/60 border border-white/5 p-3 rounded-2xl">
                    <span class="text-[11px] font-medium text-iosOrange block mb-0.5">Carbos</span>
                    <p id="carbText" class="text-sm font-bold text-white">0 / 365g</p>
                    <div class="w-full bg-neutral-800 h-1.5 rounded-full mt-2 overflow-hidden">
                        <div id="carbBar" class="bg-iosOrange h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
                <!-- Grasas -->
                <div class="bg-neutral-900/60 border border-white/5 p-3 rounded-2xl">
                    <span class="text-[11px] font-medium text-iosPink block mb-0.5">Grasas</span>
                    <p id="fatText" class="text-sm font-bold text-white">0 / 75g</p>
                    <div class="w-full bg-neutral-800 h-1.5 rounded-full mt-2 overflow-hidden">
                        <div id="fatBar" class="bg-iosPink h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Widgets de Salud: Hidratación & Suplemento -->
        <section class="grid grid-cols-2 gap-3">
            <div class="apple-glass rounded-3xl p-4 flex flex-col justify-between">
                <div class="flex justify-between items-start mb-2">
                    <div class="w-8 h-8 rounded-full bg-iosTeal/20 text-iosTeal flex items-center justify-center text-xs">
                        <i class="fa-solid fa-droplet"></i>
                    </div>
                    <span id="waterText" class="text-xs font-bold text-iosTeal">0 / 3.0L</span>
                </div>
                <div class="space-y-2">
                    <div class="w-full bg-neutral-800 h-2 rounded-full overflow-hidden">
                        <div id="waterBar" class="bg-iosTeal h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                    <div class="flex gap-1.5">
                        <button onclick="addWater(250)" class="flex-1 py-1.5 rounded-xl bg-neutral-800/90 hover:bg-neutral-700/80 text-[11px] font-bold apple-button">+250ml</button>
                        <button onclick="addWater(500)" class="flex-1 py-1.5 rounded-xl bg-neutral-800/90 hover:bg-neutral-700/80 text-[11px] font-bold apple-button">+500ml</button>
                    </div>
                </div>
            </div>

            <div class="apple-glass rounded-3xl p-4 flex flex-col justify-between">
                <div class="flex justify-between items-start mb-2">
                    <div class="w-8 h-8 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-xs">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <span class="text-xs font-semibold text-neutral-400">Creatina 5g</span>
                </div>
                <button id="creatineBtn" onclick="toggleCreatine()" class="w-full py-2.5 rounded-2xl bg-neutral-800 text-neutral-300 text-xs font-semibold apple-button">
                    Marcar Pendiente
                </button>
            </div>
        </section>

        <!-- Botones de Acción Rápida -->
        <section class="apple-glass rounded-3xl p-4 space-y-3">
            <div class="flex gap-2">
                <label class="flex-1 py-3 px-4 rounded-2xl bg-white text-black font-bold text-xs flex items-center justify-center gap-2 apple-button cursor-pointer">
                    <i class="fa-solid fa-camera"></i> Escanear con IA
                    <input type="file" id="foodImageInput" accept="image/*" capture="environment" class="hidden" onchange="previewImage(event)">
                </label>
                <button onclick="toggleModal('manualModal')" class="py-3 px-4 rounded-2xl bg-neutral-800 text-neutral-200 font-semibold text-xs flex items-center gap-1.5 apple-button">
                    <i class="fa-solid fa-plus"></i> Manual
                </button>
            </div>

            <!-- Preview IA -->
            <div id="imagePreviewContainer" class="hidden space-y-2 pt-2 border-t border-white/5">
                <img id="imagePreview" class="w-full h-40 object-cover rounded-2xl border border-neutral-700">
                <input type="text" id="foodContext" placeholder="Detalles extra: ej. 200g de carne molida y arepa..." class="w-full bg-neutral-900 border border-neutral-700 rounded-xl p-2.5 text-xs text-white">
                <button id="analyzeBtn" onclick="analyzeFoodWithAI()" class="w-full py-2.5 rounded-xl bg-iosActive text-white font-bold text-xs flex items-center justify-center gap-2 apple-button">
                    <i class="fa-solid fa-microchip"></i> Calcular Macros
                </button>
            </div>
        </section>

        <!-- Registro de Comidas del Día -->
        <section class="space-y-2.5">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-xs font-bold text-neutral-400 uppercase tracking-wider">Comidas Registradas</h2>
                <button onclick="archiveAndResetDay()" class="text-xs text-iosActive font-medium hover:underline">Guardar en Historial</button>
            </div>
            <div id="mealsList" class="space-y-2"></div>
        </section>

    </main>

    <!-- VISTA SECUNDARIA (HISTORIAL) -->
    <main id="historyView" class="max-w-md mx-auto p-4 space-y-3 hidden">
        <div class="flex justify-between items-center mb-2 px-1">
            <h2 class="text-sm font-bold text-neutral-300">Días Anteriores</h2>
            <button onclick="clearHistory()" class="text-xs text-red-400 hover:underline">Limpiar historial</button>
        </div>
        <div id="historyList" class="space-y-3"></div>
    </main>

    <!-- MODAL DE CONFIGURACIÓN & MÉTRICAS AVANZADAS -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="apple-glass w-full max-w-sm rounded-3xl p-5 space-y-4 max-h-[92vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-2 border-b border-white/10">
                <h3 class="font-bold text-base">Perfil & Metas Exactas</h3>
                <button onclick="toggleModal('settingsModal')" class="text-neutral-400"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-neutral-400 font-medium">Tu Nombre / Apodo</label>
                    <input id="uName" type="text" placeholder="Ej. Juan" class="w-full p-2.5 mt-1 rounded-xl bg-neutral-900 border border-neutral-700 text-white">
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="text-neutral-400">Peso (kg)</label>
                        <input id="uWeight" type="number" step="0.5" value="70" class="w-full p-2.5 mt-1 rounded-xl bg-neutral-900 border border-neutral-700 text-white">
                    </div>
                    <div>
                        <label class="text-neutral-400">Altura (cm)</label>
                        <input id="uHeight" type="number" value="180" class="w-full p-2.5 mt-1 rounded-xl bg-neutral-900 border border-neutral-700 text-white">
                    </div>
                    <div>
                        <label class="text-neutral-400">Edad</label>
                        <input id="uAge" type="number" value="16" class="w-full p-2.5 mt-1 rounded-xl bg-neutral-900 border border-neutral-700 text-white">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-neutral-400">Días de Gym / Pesas</label>
                        <select id="uGymDays" class="w-full p-2.5 mt-1 rounded-xl bg-neutral-900 border border-neutral-700 text-white">
                            <option value="2">2 días/sem</option>
                            <option value="3" selected>3 días/sem</option>
                            <option value="4">4 días/sem</option>
                            <option value="5">5 días/sem</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-neutral-400">Sesiones Cardio/Deporte</label>
                        <select id="uCardioDays" class="w-full p-2.5 mt-1 rounded-xl bg-neutral-900 border border-neutral-700 text-white">
                            <option value="0">Ninguna</option>
                            <option value="2" selected>1-2 días (Moderado)</option>
                            <option value="4">3-4 días (Intenso/Básquet)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-neutral-400">Actividad Diaria Pasiva (Pasos/Día a Día)</label>
                    <select id="uDailyActivity" class="w-full p-2.5 mt-1 rounded-xl bg-neutral-900 border border-neutral-700 text-white">
                        <option value="sedentary">Estudiante / Sedentario (~5k pasos)</option>
                        <option value="moderate" selected>Moderadamente Activo (~8k-10k pasos)</option>
                        <option value="active">Muy Activo (+12k pasos)</option>
                    </select>
                </div>

                <div>
                    <label class="text-neutral-400">Objetivo Nutricional</label>
                    <select id="uGoal" class="w-full p-2.5 mt-1 rounded-xl bg-neutral-900 border border-neutral-700 text-white">
                        <option value="bulk" selected>Volumen Limpio (+250 kcal)</option>
                        <option value="recomp">Recomposición (+100 kcal / Ganar fuerza)</option>
                        <option value="maintain">Mantenimiento Exacto (0 kcal)</option>
                        <option value="cut">Definición Progresiva (-350 kcal)</option>
                    </select>
                </div>

                <div class="pt-2 border-t border-neutral-800">
                    <label class="text-iosActive font-semibold">Gemini API Key</label>
                    <input id="apiKeyInput" type="password" placeholder="Clave de Google AI Studio..." class="w-full p-2.5 mt-1 rounded-xl bg-neutral-900 border border-neutral-700 text-white">
                </div>

                <button onclick="saveSettings()" class="w-full py-3 rounded-2xl bg-white text-black font-bold apple-button mt-2">
                    Recalcular y Guardar
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL DE ENTRADA MANUAL -->
    <div id="manualModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="apple-glass w-full max-w-sm rounded-3xl p-5 space-y-4">
            <div class="flex justify-between items-center pb-2 border-b border-white/10">
                <h3 class="font-bold text-base">Registrar Comida</h3>
                <button onclick="toggleModal('manualModal')" class="text-neutral-400"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <input id="mName" type="text" placeholder="Plato (ej. Batido Avena + Banano + Huevos)" class="w-full p-3 rounded-xl bg-neutral-900 border border-neutral-700 text-white">
                <div class="grid grid-cols-2 gap-2">
                    <input id="mCal" type="number" placeholder="Calorías (kcal)" class="p-3 rounded-xl bg-neutral-900 border border-neutral-700 text-white">
                    <input id="mProt" type="number" placeholder="Proteína (g)" class="p-3 rounded-xl bg-neutral-900 border border-neutral-700 text-white">
                    <input id="mCarb" type="number" placeholder="Carbos (g)" class="p-3 rounded-xl bg-neutral-900 border border-neutral-700 text-white">
                    <input id="mFat" type="number" placeholder="Grasas (g)" class="p-3 rounded-xl bg-neutral-900 border border-neutral-700 text-white">
                </div>
                <button onclick="saveManualMeal()" class="w-full py-3 rounded-2xl bg-white text-black font-bold apple-button">Guardar Alimento</button>
            </div>
        </div>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('pulseFitState')) || {
            user: { name: 'Juan', weight: 70, height: 180, age: 16, gymDays: 3, cardioDays: 2, neat: 'moderate', goal: 'bulk' },
            targets: { cal: 2750, prot: 150, carb: 365, fat: 75, water: 3000 },
            today: { date: new Date().toISOString().split('T')[0], cal: 0, prot: 0, carb: 0, fat: 0, water: 0, creatine: false, meals: [] },
            history: [],
            apiKey: ''
        };

        let currentImageBase64 = null;

        function init() {
            setGreeting();
            document.getElementById('userNameDisplay').innerText = state.user.name || 'Atleta';
            document.getElementById('uName').value = state.user.name || '';
            document.getElementById('uWeight').value = state.user.weight;
            document.getElementById('uHeight').value = state.user.height;
            document.getElementById('uAge').value = state.user.age;
            document.getElementById('uGymDays').value = state.user.gymDays;
            document.getElementById('uCardioDays').value = state.user.cardioDays;
            document.getElementById('uDailyActivity').value = state.user.neat || 'moderate';
            document.getElementById('uGoal').value = state.user.goal;
            document.getElementById('apiKeyInput').value = state.apiKey || '';
            updateUI();
        }

        function setGreeting() {
            const hour = new Date().getHours();
            let text = "HOLA";
            if (hour >= 5 && hour < 12) text = "BUENOS DÍAS";
            else if (hour >= 12 && hour < 19) text = "BUENAS TARDES";
            else text = "BUENAS NOCHES";
            document.getElementById('greetingText').innerText = text;
        }

        function saveState() {
            localStorage.setItem('pulseFitState', JSON.stringify(state));
            updateUI();
        }

        function updateUI() {
            const t = state.targets;
            const d = state.today;

            const rem = Math.max(0, t.cal - d.cal);
            const pct = Math.min(100, Math.round((d.cal / t.cal) * 100));

            document.getElementById('calRemaining').innerText = rem.toLocaleString();
            document.getElementById('calTarget').innerText = t.cal.toLocaleString();
            document.getElementById('calEaten').innerText = d.cal.toLocaleString();
            document.getElementById('calPercent').innerText = pct + '%';

            // SVG Anillo Apple Watch (Circunferencia = 251.2)
            const offset = 251.2 - (251.2 * (pct / 100));
            document.getElementById('calSvgRing').style.strokeDashoffset = offset;

            // Macros
            document.getElementById('protText').innerText = `${d.prot} / ${t.prot}g`;
            document.getElementById('protBar').style.width = `${Math.min(100, (d.prot / t.prot) * 100)}%`;

            document.getElementById('carbText').innerText = `${d.carb} / ${t.carb}g`;
            document.getElementById('carbBar').style.width = `${Math.min(100, (d.carb / t.carb) * 100)}%`;

            document.getElementById('fatText').innerText = `${d.fat} / ${t.fat}g`;
            document.getElementById('fatBar').style.width = `${Math.min(100, (d.fat / t.fat) * 100)}%`;

            // Agua y Creatina
            document.getElementById('waterText').innerText = `${(d.water/1000).toFixed(1)} / ${(t.water/1000).toFixed(1)}L`;
            document.getElementById('waterBar').style.width = `${Math.min(100, (d.water / t.water) * 100)}%`;

            const cBtn = document.getElementById('creatineBtn');
            if (d.creatine) {
                cBtn.className = "w-full py-2.5 rounded-2xl bg-iosGreen/20 border border-iosGreen/40 text-iosGreen text-xs font-bold apple-button";
                cBtn.innerHTML = `<i class="fa-solid fa-check"></i> Creatina Tomada`;
            } else {
                cBtn.className = "w-full py-2.5 rounded-2xl bg-neutral-800 text-neutral-400 text-xs font-semibold apple-button";
                cBtn.innerHTML = `Pendiente`;
            }

            // Lista comidas
            const list = document.getElementById('mealsList');
            if (d.meals.length === 0) {
                list.innerHTML = `<div class="apple-glass rounded-2xl p-4 text-center text-xs text-neutral-500">Sin comidas registradas hoy.</div>`;
            } else {
                list.innerHTML = d.meals.map((m, idx) => `
                    <div class="apple-glass rounded-2xl p-3.5 flex justify-between items-center">
                        <div>
                            <p class="font-bold text-xs text-white">${m.name}</p>
                            <p class="text-[11px] text-neutral-400 mt-0.5">
                                <span class="text-iosActive">${m.prot}g P</span> • 
                                <span class="text-iosOrange">${m.carb}g C</span> • 
                                <span class="text-iosPink">${m.fat}g G</span>
                            </p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-xs text-neutral-200">${m.cal} kcal</span>
                            <button onclick="deleteMeal(${idx})" class="text-neutral-500 hover:text-red-400"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        </div>
                    </div>
                `).join('');
            }

            renderHistory();
        }

        function switchView(tab) {
            if (tab === 'today') {
                document.getElementById('todayView').classList.remove('hidden');
                document.getElementById('historyView').classList.add('hidden');
                document.getElementById('tabToday').className = "flex-1 py-1.5 text-xs font-semibold rounded-xl bg-neutral-800 text-white shadow-sm transition-all";
                document.getElementById('tabHistory').className = "flex-1 py-1.5 text-xs font-semibold rounded-xl text-neutral-400 transition-all";
            } else {
                document.getElementById('todayView').classList.add('hidden');
                document.getElementById('historyView').classList.remove('hidden');
                document.getElementById('tabToday').className = "flex-1 py-1.5 text-xs font-semibold rounded-xl text-neutral-400 transition-all";
                document.getElementById('tabHistory').className = "flex-1 py-1.5 text-xs font-semibold rounded-xl bg-neutral-800 text-white shadow-sm transition-all";
            }
        }

        function renderHistory() {
            const hList = document.getElementById('historyList');
            if (!state.history || state.history.length === 0) {
                hList.innerHTML = `<div class="apple-glass rounded-2xl p-5 text-center text-xs text-neutral-500">No hay días guardados aún. Toca "Guardar en Historial" al terminar tu día.</div>`;
                return;
            }
            hList.innerHTML = state.history.map((day) => `
                <div class="apple-glass rounded-2xl p-4">
                    <div class="flex justify-between items-center mb-2 pb-2 border-b border-white/5">
                        <span class="font-bold text-xs text-neutral-300">${day.date}</span>
                        <span class="text-xs font-extrabold text-iosGreen">${day.cal} kcal</span>
                    </div>
                    <div class="flex justify-between text-[11px] text-neutral-400">
                        <span>P: <b class="text-white">${day.prot}g</b></span>
                        <span>C: <b class="text-white">${day.carb}g</b></span>
                        <span>G: <b class="text-white">${day.fat}g</b></span>
                        <span>Agua: <b class="text-iosTeal">${(day.water/1000).toFixed(1)}L</b></span>
                    </div>
                </div>
            `).join('');
        }

        function archiveAndResetDay() {
            if (state.today.cal === 0) {
                alert('Registra al menos una comida antes de archivar.');
                return;
            }
            if (confirm('¿Deseas guardar el día de hoy en el Historial y comenzar uno nuevo?')) {
                state.history.unshift({ ...state.today });
                state.today = { date: new Date().toISOString().split('T')[0], cal: 0, prot: 0, carb: 0, fat: 0, water: 0, creatine: false, meals: [] };
                saveState();
            }
        }

        function clearHistory() {
            if (confirm('¿Borrar todo el historial guardado?')) {
                state.history = [];
                saveState();
            }
        }

        function addWater(amount) {
            state.today.water += amount;
            saveState();
        }

        function toggleCreatine() {
            state.today.creatine = !state.today.creatine;
            saveState();
        }

        function addMealObject(name, cal, prot, carb, fat) {
            state.today.meals.unshift({ name, cal, prot, carb, fat });
            state.today.cal += cal;
            state.today.prot += prot;
            state.today.carb += carb;
            state.today.fat += fat;
            saveState();
        }

        function saveManualMeal() {
            const name = document.getElementById('mName').value || 'Alimento';
            const cal = parseInt(document.getElementById('mCal').value) || 0;
            const prot = parseInt(document.getElementById('mProt').value) || 0;
            const carb = parseInt(document.getElementById('mCarb').value) || 0;
            const fat = parseInt(document.getElementById('mFat').value) || 0;
            addMealObject(name, cal, prot, carb, fat);
            toggleModal('manualModal');
            ['mName','mCal','mProt','mCarb','mFat'].forEach(id => document.getElementById(id).value = '');
        }

        function deleteMeal(idx) {
            const m = state.today.meals[idx];
            state.today.cal -= m.cal;
            state.today.prot -= m.prot;
            state.today.carb -= m.carb;
            state.today.fat -= m.fat;
            state.today.meals.splice(idx, 1);
            saveState();
        }

        // CÁLCULO QUIRÚRGICO DE METABOLISMO
        function saveSettings() {
            const name = document.getElementById('uName').value.trim() || 'Atleta';
            const w = parseFloat(document.getElementById('uWeight').value) || 70;
            const h = parseFloat(document.getElementById('uHeight').value) || 180;
            const a = parseFloat(document.getElementById('uAge').value) || 16;
            const gymDays = parseInt(document.getElementById('uGymDays').value);
            const cardioDays = parseInt(document.getElementById('uCardioDays').value);
            const neat = document.getElementById('uDailyActivity').value;
            const goal = document.getElementById('uGoal').value;
            state.apiKey = document.getElementById('apiKeyInput').value.trim();

            // 1. TMB base (Mifflin-St Jeor)
            const bmr = (10 * w) + (6.25 * h) - (5 * a) + 5;

            // 2. Factor Actividad Base (NEAT)
            let activityMultiplier = 1.2; // Sedentario
            if (neat === 'moderate') activityMultiplier = 1.35;
            if (neat === 'active') activityMultiplier = 1.45;

            // 3. Adición por entrenamiento de Pesas y Cardio
            const gymFactor = (gymDays * 0.04);       // ~4% por día de pesas
            const cardioFactor = (cardioDays * 0.035); // ~3.5% por día de cardio
            const totalMultiplier = activityMultiplier + gymFactor + cardioFactor;

            let tdee = Math.round(bmr * totalMultiplier);

            // 4. Ajuste por objetivo
            if (goal === 'bulk') tdee += 250;
            else if (goal === 'recomp') tdee += 100;
            else if (goal === 'cut') tdee -= 350;

            // 5. Reparto de Macros personalizado
            const prot = Math.round(w * 2.15); // ~150g para 70kg
            const fat = Math.round(w * 1.05);  // ~75g para 70kg
            const carb = Math.round((tdee - (prot * 4) - (fat * 9)) / 4);

            state.user = { name, weight: w, height: h, age: a, gymDays, cardioDays, neat, goal };
            state.targets = { cal: tdee, prot, carb, fat, water: Math.round(w * 42) };
            
            document.getElementById('userNameDisplay').innerText = name;
            saveState();
            toggleModal('settingsModal');
        }

        // Gemini Vision API
        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagePreview').src = e.target.result;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
                currentImageBase64 = e.target.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }

       // 1. Nueva función con compresión de imagen automática
        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Magia de compresión: reducimos la foto a un tamaño perfecto para la API
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 800; 
                    let width = img.width;
                    let height = img.height;

                    // Mantener la proporción
                    if (width > height && width > MAX_SIZE) {
                        height *= MAX_SIZE / width;
                        width = MAX_SIZE;
                    } else if (height > MAX_SIZE) {
                        width *= MAX_SIZE / height;
                        height = MAX_SIZE;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Convertimos a JPEG con 75% de calidad (pesará poquísimo)
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.75);

                    document.getElementById('imagePreview').src = compressedDataUrl;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                    
                    // Guardamos la versión ligera para enviarla a Gemini
                    currentImageBase64 = compressedDataUrl.split(',')[1];
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 2. Nueva función de conexión reforzada y modelo estable
        async function analyzeFoodWithAI() {
            if (!state.apiKey) {
                alert('Abre Ajustes (⚙️) y pega tu API Key de Google AI Studio.');
                toggleModal('settingsModal');
                return;
            }
            const btn = document.getElementById('analyzeBtn');
            const context = document.getElementById('foodContext').value;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Analizando...`;
            btn.disabled = true;

            try {
                const prompt = `Analiza esta comida. Contexto: "${context}". Devuelve ÚNICAMENTE un JSON válido con: {"name": "Nombre corto", "cal": numero_entero, "prot": numero_entero, "carb": numero_entero, "fat": numero_entero}`;
                
                // Usamos gemini-1.5-flash que es el más rápido y estable en la web
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${state.apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inline_data: { mime_type: "image/jpeg", data: currentImageBase64 } }
                            ]
                        }]
                    })
                });
                
                if (!response.ok) throw new Error("Error de conexión con Google AI");
                
                const data = await response.json();
                const rawText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                const food = JSON.parse(rawText);

                addMealObject(food.name, food.cal, food.prot, food.carb, food.fat);
                document.getElementById('imagePreviewContainer').classList.add('hidden');
                document.getElementById('foodContext').value = '';
            } catch (err) {
                console.error(err);
                alert('Error al procesar. Verifica tu API Key o intenta con otra foto más iluminada.');
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-microchip"></i> Calcular Macros`;
                btn.disabled = false;
            }
        }

        function exportForAI() {
            const d = state.today;
            const t = state.targets;
            const u = state.user;
            const mealsText = d.meals.map(m => `- ${m.name}: ${m.cal} kcal (${m.prot}g P, ${m.carb}g C, ${m.fat}g G)`).join('\n') || '- Sin registros';
            
            const report = `📊 REPORTE DIARIO DE ${u.name.toUpperCase()} (${new Date().toLocaleDateString('es-ES')})
• Estado: ${u.weight}kg | Gym: ${u.gymDays}d/sem | Cardio: ${u.cardioDays}d/sem | Meta: ${u.goal.toUpperCase()}
• Calorías: ${d.cal} / ${t.cal} kcal
• Proteínas: ${d.prot} / ${t.prot} g
• Carbohidratos: ${d.carb} / ${t.carb} g
• Grasas: ${d.fat} / ${t.fat} g
• Hidratación: ${(d.water/1000).toFixed(1)} / ${(t.water/1000).toFixed(1)} L | Creatina: ${d.creatine ? 'Tomada ✅' : 'Pendiente ❌'}
• Comidas:
${mealsText}

Dime qué puedo cenar o ajustar para cerrar mis macros exactos de hoy.`;

            navigator.clipboard.writeText(report);
            alert('✅ Resumen copiado. Pégalo directamente en nuestro chat para que te ayude a cuadrar el día.');
        }

        function toggleModal(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        init();
    </script>
</body>
